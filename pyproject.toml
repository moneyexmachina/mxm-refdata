[project]
name = "mxm-refdata"
version = "0.1.0"
description = "Canonical reference data package for Money-ex-Machina. Provides identifiers, metadata, and mappings (e.g. tickers, exchanges, calendars, etc.) to ensure consistency across MXM modules."
authors = [
    {name = "mxm",email = "contact@moneyexmachina.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13"
packages = [{ include = "mxm_refdata" }]
include = ["mxm_refdata/data/*"]


[tool.poetry.dependencies]
python = ">=3.13,<4.0"
pandas = ">=2.3.3,<3.0.0"
sqlalchemy = ">=2.0.43,<3.0.0"
exchange-calendars = { version = "^4.11.1", markers = "python_version >= '3.10' and python_version < '4.0'" }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
black = "^25.9.0"
ruff = "^0.13.2"
isort = "^6.0.1"
pytest = "^8.4.2"
pytest-mock = "^3.15.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# -------------------------
# Coding standards
# -------------------------
[tool.ruff]
line-length = 88
target-version = "py312"
# Select rulesets; expand gradually if desired
select = ["E", "F", "B", "ANN"]
ignore = ["ANN101", "ANN102"]
# Exclude common non-source dirs
exclude = ["build", "dist", ".venv"]


[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["mxm_refdata"]
combine_as_imports = true

[tool.pyright]
typeCheckingMode = "strict"            # or "strict" if you want more enforcement
include = ["mxm_config"]
exclude = ["build", "dist", "docs", ".venv"]
pythonVersion = "3.12"
pythonPlatform = "All"
reportMissingImports = "error"
reportMissingTypeStubs = "warning"
